[metadata]
name = siglip-embeddings
version = 0.1.0
description = A project for working with SigLIP and Jina embeddings
author = Joseph
long_description = file: README.txt
long_description_content_type = text/plain

[options]
python_requires = >=3.8
packages = find:
install_requires =
    torch
    transformers
    pillow
    sentencepiece
    protobuf
    torchvision

[options.packages.find]
where = .
exclude =
    venv*
    .git*
    __pycache__
    *.egg-info

[options.entry_points]
console_scripts =
    siglip-text = gem_code:main
