[metadata]
name = siglip-embedding-service
version = 2.0.0
description = FastAPI microservice for SigLIP 2 text and image embeddings
author = Joseph
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.8
py_modules = app
install_requires =
    torch
    transformers>=4.49.0
    pillow
    sentencepiece
    protobuf
    torchvision
    fastapi
    uvicorn[standard]
    python-multipart
    python-dotenv

[options.entry_points]
console_scripts =
    siglip-service = app:main
